# Prometheus scrape config. Polls vLLM's /metrics endpoint and (optionally) the
# app layer. Grafana reads from this Prometheus instance.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # vLLM exposes rich inference metrics at /metrics (Prometheus format):
  # time-to-first-token, tokens/sec, running/waiting requests, KV-cache usage.
  - job_name: "vllm"
    metrics_path: /metrics
    static_configs:
      - targets: ["vllm:8000"]

  # The FastAPI app layer (basic process/HTTP metrics if instrumented later).
  - job_name: "app"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8080"]
