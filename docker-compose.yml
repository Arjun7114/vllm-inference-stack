# ------------------------------------------------------------------------------
# The full stack:
#   vllm        - model server (GPU)
#   app         - FastAPI app layer
#   prometheus  - scrapes vLLM's /metrics
#   grafana     - dashboards over Prometheus
#
# Readiness gate: the app does NOT start until vLLM's healthcheck passes, so it
# never accepts traffic before the model has finished loading (minutes). This is
# the core orchestration lesson of the phase.
#
# Run on a GPU host with the NVIDIA container runtime available.
# ------------------------------------------------------------------------------

services:
  vllm:
    image: vllm/vllm-openai:latest
    command: >
      --model mistralai/Mistral-7B-Instruct-v0.3
      --gpu-memory-utilization 0.90
      --max-model-len 8192
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - VLLM_USE_FLASHINFER_SAMPLER=0
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 600s

  app:
    build: .
    environment:
      - BACKEND=vllm
      - VLLM_BASE_URL=http://vllm:8000
      - MODEL_NAME=mistralai/Mistral-7B-Instruct-v0.3
      - API_KEY=${API_KEY:-dev-key-change-me}
    ports:
      - "8080:8080"
    depends_on:
      vllm:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - vllm

  grafana:
    image: grafana/grafana:latest
    environment:
      # Anonymous view access so dashboards open without a login prompt.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
